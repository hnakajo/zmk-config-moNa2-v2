include:

  # ============================================================
  # 右側：PAW3222
  # 実機でトラックボール動作確認済みの clean 構成
  # studio-rpc-usb-uart は使用しない
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_r rgbled_adapter
    cmake-args: '-DEXTRA_CONF_FILE=../../config/paw3222.conf -DDTS_EXTRA_CPPFLAGS=-DCONFIG_TRACKBALL_PAW3222'
    artifact-name: mona2_r-paw3222

  # ============================================================
  # 左側
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_l rgbled_adapter
    artifact-name: mona2_l

  # ============================================================
  # Settings Reset
  # 通常のキーマップ変更では使用しない
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
