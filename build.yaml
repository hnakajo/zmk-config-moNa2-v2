# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property.
#
# moNa2 PAW3222 diagnosis / production candidate builds

---

include:

  # ============================================================
  # 1. PMW3610版
  #    比較用。今回の実機では使用しない。
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: mona2_r-pmw3610


  # ============================================================
  # 2. PAW3222 + Studio
  #
  #    DYA Studio用の通常構成。
  #    PAW3222を確実に選択するため、
  #    EXTRA_CONF_FILE と DTS_EXTRA_CPPFLAGS の両方を指定。
  #
  #    今回、この構成ではトラックボールが動かなかった。
  #    比較対象として残す。
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: '-DEXTRA_CONF_FILE=../../config/paw3222.conf -DDTS_EXTRA_CPPFLAGS=-DCONFIG_TRACKBALL_PAW3222'
    artifact-name: mona2_r-paw3222-studio


  # ============================================================
  # 3. PAW3222 + CDC
  #
  #    ★現在、実機でトラックボールが動いた構成★
  #
  #    この構成は絶対に変更せず、
  #    動作確認済みの基準ファームとして残す。
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_r rgbled_adapter
    snippet: cdc-acm-console
    cmake-args: '-DEXTRA_CONF_FILE=../../config/paw3222.conf -DDTS_EXTRA_CPPFLAGS=-DCONFIG_TRACKBALL_PAW3222'
    artifact-name: mona2_r-paw3222-known-good


  # ============================================================
  # 4. PAW3222 clean版
  #
  #    StudioもCDC Consoleも付けない。
  #    PAW3222そのものだけで動くかを確認するためのテスト。
  #
  #    次に実機へ書き込むのはこれ。
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_r rgbled_adapter
    cmake-args: '-DEXTRA_CONF_FILE=../../config/paw3222.conf -DDTS_EXTRA_CPPFLAGS=-DCONFIG_TRACKBALL_PAW3222'
    artifact-name: mona2_r-paw3222-clean


  # ============================================================
  # 5. 左側
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: mona2_l rgbled_adapter


  # ============================================================
  # 6. Settings Reset
  # ============================================================
  - board: seeeduino_xiao_ble
    shield: settings_reset
